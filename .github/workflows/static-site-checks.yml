name: Cloudflare Pages static checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in config.js sw.js js/*.js; do
            test -f "$file"
            node --check "$file"
          done
      - name: Audit repository assets, versioning, styles and configuration
        run: node scripts/audit-static-site.mjs
      - name: Install browser-test dependencies
        run: npm install --no-save @playwright/test http-server
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser smoke tests
        shell: bash
        run: |
          set -euo pipefail
          npx http-server . -p 4173 -c-1 > /tmp/ie-http-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break || sleep 1; done
          npx playwright test --config=playwright.config.js
      - name: Validate Cloudflare Pages assets and security basics
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f _redirects
          test -f _headers
          test ! -f netlify.toml
          version="$(tr -d '\r\n' < VERSION)"
          test -n "$version"
          grep -Fq "$version" index.html
          grep -Fq "$version" sw.js
          grep -Fq '/* /index.html 200' _redirects
          grep -Fq 'Content-Security-Policy:' _headers
          grep -Fq 'X-Content-Type-Options: nosniff' _headers
          grep -Fq 'Cache-Control: no-store' _headers
          ! grep -Eiq 'service_role|SUPABASE_SECRET_KEY|sb_secret_' config.js
          grep -Fq 'SUPABASE_URL:' config.js
          grep -Fq 'SUPABASE_ANON_KEY:' config.js
