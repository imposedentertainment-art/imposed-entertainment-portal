        var touch = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
        var narrowScreen = window.screen && Math.min(window.screen.width || 9999, window.screen.height || 9999) <= 600;

    })();

<body data-portal-build="3.3.70">
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <div id="app" aria-busy="true"><main class="boot-skeleton" aria-label="Loading Imposed Entertainment"><div class="boot-brand"><img src="/img/logo-128.png?v=3.3.70" alt=""><span>IMPOSED ENTERTAINMENT</span></div><div class="boot-skeleton-line wide"></div><div class="boot-skeleton-line"></div><div class="boot-skeleton-grid"><i></i><i></i><i></i></div><p>Preparing your workspace…</p></main></div>
  <div id="app-loading" class="app-loading" role="status" aria-live="polite"><div class="loading-card"><span class="loading-spinner" aria-hidden="true"></span><strong id="loading-message">Preparing your workspace…</strong><small id="loading-detail">Build 3.3.70 · Connecting securely</small><button id="loading-retry" type="button" hidden onclick="location.reload()">Reload portal</button></div></div>
  <div id="network-status" class="network-status" role="status" aria-live="polite" hidden></div>
  <div id="toast-root" aria-live="polite"></div>
  <script>
    (function(){
      var timer=setTimeout(function(){var d=document.getElementById('loading-detail'),b=document.getElementById('loading-retry');if(d)d.textContent='This is taking longer than expected. Check your connection and try again.';if(b)b.hidden=false;},18000);
      window.addEventListener('portal-ready',function(){clearTimeout(timer);});
      var onlineTimer;
      function network(){var n=document.getElementById('network-status');if(!n)return;clearTimeout(onlineTimer);if(!navigator.onLine){n.hidden=false;n.textContent='You appear to be offline. Some portal features may be unavailable.';n.classList.remove('is-online');return;}if(!n.hidden){n.hidden=false;n.textContent='Connection restored.';n.classList.add('is-online');onlineTimer=setTimeout(function(){n.hidden=true;},2600);}}
      window.addEventListener('offline',network);window.addEventListener('online',network);network();
      // Restore vertical scrolling after browser back/forward cache and mobile route changes.
      function restoreDocumentScroll(){if(!document.documentElement||!document.body)return;document.documentElement.style.overflowY='auto';document.body.style.overflow='';document.body.style.overflowY='auto';document.body.style.touchAction='pan-y pinch-zoom';}
      window.addEventListener('pageshow',restoreDocumentScroll);window.addEventListener('load',restoreDocumentScroll,{once:true});
      // Keep missing logos and user-uploaded artwork from leaving broken-image icons.
      document.addEventListener('error',function(event){
        var img=event.target;
        if(!img||img.tagName!=='IMG'||img.dataset.fallbackHandled==='1')return;
        img.dataset.fallbackHandled='1';
        var rect=img.getBoundingClientRect();
        var fallback=document.createElement('span');
        fallback.className=(img.className?img.className+' ':'')+'image-load-fallback';
        fallback.setAttribute('role',img.alt?'img':'presentation');
        if(img.alt)fallback.setAttribute('aria-label',img.alt);
        else fallback.setAttribute('aria-hidden','true');
        var label=String(img.alt||'').trim();
        fallback.textContent=label?Array.from(label).filter(function(c){return /[A-Za-z0-9\u00C0-\u024F]/.test(c);}).slice(0,2).join('').toUpperCase():'♪';
        if(!fallback.textContent)fallback.textContent='♪';
        fallback.style.width=(rect.width||32)+'px';
        fallback.style.height=(rect.height||32)+'px';
        fallback.style.flex='0 0 auto';
        img.replaceWith(fallback);
      },true);
      window.addEventListener('unhandledrejection',function(){
        var app=document.getElementById('app');
        if(app&&app.getAttribute('aria-busy')==='true'){
          var detail=document.getElementById('loading-detail');
          if(detail)detail.textContent='A connection step failed. You can retry without losing saved data.';
          var retry=document.getElementById('loading-retry');if(retry)retry.hidden=false;
        }
      });
    })();
  </script>

  <script>
    console.info("Imposed Entertainment portal build 3.3.70");
    if ("serviceWorker" in navigator) {
      // Check for a fresh worker on every page load and bypass the browser HTTP cache
      // when checking the worker script itself.
      var hadServiceWorkerController = !!navigator.serviceWorker.controller;
      var updateReloadKey = "ie-sw-update-reload-3.3.70";
      navigator.serviceWorker.addEventListener("controllerchange", function () {
        // A first install should not interrupt the initial page load.
        if (!hadServiceWorkerController) {
          hadServiceWorkerController = true;
          return;
        }
        try {
          if (sessionStorage.getItem(updateReloadKey) === "1") return;
          sessionStorage.setItem(updateReloadKey, "1");
        } catch (_) {
          if (window.__ieUpdateReloaded) return;
          window.__ieUpdateReloaded = true;
        }
        window.location.reload();
      });
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("/sw.js", { updateViaCache: "none" })
          .then(function (registration) { return registration.update(); })
          .catch(function () { /* Offline caching is optional; the portal remains usable if updates are blocked. */ });
      }, { once: true });
    }
